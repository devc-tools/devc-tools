</style></head><body><div id="root"></div><script>
(()=>{
const q=new URLSearchParams(location.search).get('view')||'refined';
const dot=(state,label)=>`<span class="state ${state}"><i class="dot"></i>${label}</span>`;
const brand=`<div class="brand"><span class="logo">d</span> devc <span style="font-size:11px;color:#657488;font-weight:450;margin-left:10px;letter-spacing:0">AGENT WORKSPACE</span></div>`;
const top=(actions)=>`<header class="top">${brand}<div class="flex">${actions}<span style="width:1px;height:19px;background:#343b46;margin:0 6px"></span><span class="small muted">⌘ K</span><span class="pill green"><i class="dot"></i> Connected</span></div></header>`;
const foot=(label)=>`<footer class="statusbar"><span class="green">● Bridge connected</span><span>Keep awake on</span><span>18 running projects</span><span class="concept">${label} · DESIGN CONCEPT · illustrative panel content & status counts</span></footer>`;
const project=(name,meta,active=false,state='idle')=>`<div class="project ${active?'active':''}"><div class="name"><span class="${state==='running'?'blue':'dim'}">▱</span>${name}<span class="righttag ${state}">●</span></div><div class="meta">${meta}</div>${active?'<div class="subnav"><span class="selected">Agents 2</span><span>Files</span><span>Git ↑4</span></div>':''}</div>`;
const sidebar=(mode)=>`<aside class="sidebar"><div class="search"><span>⌕ &nbsp; Find project or agent</span><span>⌘ P</span></div><div class="navrow ${mode==='overview'?'active':''}" style="margin-top:16px"><span>◫</span> Overview <span class="count">18</span></div><div class="navrow"><span class="amber">◉</span> Needs attention <span class="count amber">2</span></div><div class="navrow"><span>☷</span> Tasks <span class="count">1</span></div><div class="label"><span>PINNED PROJECTS</span><span>＋</span></div>${project('tools/devc-tools','<span>code-wksp</span><span>·</span><span>2 agents</span>',mode!=='overview','running')}${project('vscode-deephaven','<span>main</span><span>·</span><span>1 agent</span>')}${project('time-tracking','<span>main</span><span>·</span><span>1 agent</span>')}<div class="label"><span>RECENT PROJECTS</span><span>9</span></div>${project('DH-24092 · vsix-sbom','<span>code-wksp</span><span>·</span><span>Idle</span>')}${project('DH-23855 · npm-audit-fix','<span>1 agent</span><span>·</span><span class="amber">Needs input</span>',false,'waiting')}${project('DH-23956 · mcp-ts-sdk-v2','<span>1 agent</span><span>·</span><span>Idle</span>')}${project('DH-24018 · release-scripts','<span>Terminal only</span>')}<div class="navrow small dim" style="margin-top:12px">All projects <span class="count">18 →</span></div><div class="sidebar-foot"><span>▱</span><span>Not running</span><span class="count">15 &nbsp; ›</span></div></aside>`;
const panel=(title,agent,state,label,body,extra='')=>`<section class="panel ${extra}"><header class="panelhead"><span class="agenticon ${agent==='π'?'pi':''}">${agent}</span><span class="title">${title}</span><span class="grow"></span>${dot(state,label)}<span class="dim" style="margin-left:10px">⋯ &nbsp; ⤢</span></header><div class="panelmeta"><span>${title.includes('SBOM')?'code-wksp / DH-24092_vsix-sbom':'code-wksp / tools/devc-tools'}</span><span class="righttag">⌥ ${title.includes('SBOM')?'2':'1'}</span></div><div class="terminal">${body}</div><div class="termfoot"><span>${agent==='π'?'pi':'Claude Code'}</span><span>${state==='running'?'Working · 24s':state==='waiting'?'Waiting for your input':'Idle · ready for a prompt'}</span></div></section>`;
const uxbody=`<p class="hint">π &nbsp; devc-tools</p><div class="prompt">Review the orchestration UX and propose visual directions.<br>Do not change the codebase.</div><h3>Reviewing the current workspace</h3><p>I can access the app and inspect the sidebar without<br>sending input to running agents.</p><p class="ok">✓ Connected to devc web<br>✓ Captured the current navigation<br>✓ Repository left unchanged</p><div class="rule"></div><p class="path">Observations</p><p>1. Repeated project subtrees dominate navigation.<br>2. Long project and session titles are truncated.<br>3. Agent status is hard to scan across projects.</p><p class="path">Proposed directions</p><p>• Group navigation by project and reveal details on demand.<br>• Surface agents that need input.<br>• Keep terminal content dense; simplify surrounding chrome.</p><div class="rule"></div><p><span class="blue">◌</span> Rendering visual concepts…</p><p class="hint">No source files modified.</p>`;
const sbombody=`<p class="hint">Claude Code · vsix-sbom plan implementation</p><p class="ok">✓ Implementation plan prepared</p><p>Plan covers the SBOM generation step, release artifacts,<br>and validation of the packaged extension.</p><p class="path">.plans/vsix-sbom.md</p><div class="rule"></div><p class="hint">› Send a message to continue</p>`;
const taskbody=`<p class="hint">Preview · saved task</p><h3>Open issue references in Jira</h3><p>Show “Open in Jira” when a terminal contains<br>an issue reference such as AB-12345.</p><p class="hint">tools/devc-tools &nbsp; · &nbsp; Not started</p><div class="rule"></div><p><span class="path">Plan first</span> &nbsp; or &nbsp; <span class="ok">Implement</span></p>`;
function refined(){return `<div class="app">${top('<button class="btn">▦ &nbsp; Saved layouts ▾</button><button class="btn primary">＋ New task</button>')}<div class="body">${sidebar('refined')}<main class="main"><div class="workspacebar"><div><h1>tools/devc-tools</h1><p>code-wksp &nbsp; / &nbsp; main &nbsp; · &nbsp; 2 agents</p></div><div class="toolbar"><span class="tool">◫ &nbsp; Split</span><span class="tool">＋ &nbsp; Terminal</span><span class="tool">▱ &nbsp; Files</span><span class="tool">⌥ Z &nbsp; Focus</span></div></div><div class="panels">${panel('UX exploration','π','running','Working',uxbody,'large focused')}${panel('VSIX SBOM plan','✳','idle','Idle',sbombody)}${panel('Task details','☷','idle','Draft',taskbody)}</div></main></div>${foot('01 / REFINED WORKSPACE')}</div>`}
function overview(){return `<div class="app">${top('<button class="btn">View: All projects ▾</button><button class="btn primary">＋ New task</button>')}<div class="body">${sidebar('overview')}<main class="main"><div class="tabs"><span class="on">Overview</span><span>Agents <span class="dim">20</span></span><span>Tasks</span><span>Sessions</span></div><div class="content"><div class="eyebrow">WORKSPACE OVERVIEW</div><div class="flex"><div><h1 class="headline">Know what needs you. Then get back to work.</h1><p class="subtitle">Agent activity across your projects, without opening every terminal.</p></div></div><div class="summary"><div><div class="number amber">2</div><div class="caption">Need your input</div></div><div><div class="number blue">3</div><div class="caption">Working</div></div><div><div class="number">15</div><div class="caption">Idle</div></div><div><div class="number">1</div><div class="caption">Unsent task</div></div><div class="grow"></div><span class="pill" style="align-self:center">● &nbsp; Updates live</span></div><div class="attention"><span class="symbol">!</span><div><h3>npm audit failures after pre-release</h3><p>Claude is waiting for a decision about the dependency update strategy.</p></div><span class="grow"></span><span class="small muted">DH-23855</span><button class="btn" style="border-color:#775d3e;color:#edc797;background:#30271d">Review request →</button></div><div class="sectionhead"><h2>Working now <span class="dim small">&nbsp; 3 agents</span></h2><span class="subtlelink">Open workspace →</span></div><div class="cards"><article class="card"><div class="flex"><span class="agenticon pi">π</span>${dot('running','Working')}<span class="grow"></span><span class="dim">⋯</span></div><div class="projectname">TOOLS / DEVC-TOOLS</div><h3>UX exploration</h3><div class="excerpt">Inspecting the current workspace and rendering three visual concepts.</div><div class="cardfoot"><span>Started 6 min ago</span><span class="subtlelink">Open panel ↗</span></div></article><article class="card"><div class="flex"><span class="agenticon">✳</span>${dot('running','Working')}<span class="grow"></span><span class="dim">⋯</span></div><div class="projectname">DH-24092 / VSIX-SBOM</div><h3>Verify release artifacts</h3><div class="excerpt">Checking the proposed SBOM generation and extension packaging steps.</div><div class="cardfoot"><span>Started 12 min ago</span><span class="subtlelink">Open panel ↗</span></div></article><article class="card"><div class="flex"><span class="agenticon">✳</span>${dot('running','Working')}<span class="grow"></span><span class="dim">⋯</span></div><div class="projectname">DH-23956 / MCP-TS-SDK-V2</div><h3>Review latest PR feedback</h3><div class="excerpt">Reviewing the latest comments and comparing the SDK integration changes.</div><div class="cardfoot"><span>Started 18 min ago</span><span class="subtlelink">Open panel ↗</span></div></article></div><div class="sectionhead"><h2>Ready to return to</h2><span class="subtlelink">All sessions →</span></div><div class="table"><div class="tr"><span>SESSION</span><span>PROJECT</span><span>AGENT</span><span>STATUS</span></div><div class="tr"><span>Resume npm publish:prerelease</span><span class="meta">vscode-deephaven</span><span class="meta">Claude</span>${dot('idle','Idle')}</div><div class="tr"><span>Report unaccounted entries</span><span class="meta">time-tracking</span><span class="meta">Claude</span>${dot('idle','Idle')}</div><div class="tr"><span>Deephaven Docs MCP server access</span><span class="meta">notebooks</span><span class="meta">Claude</span>${dot('idle','Idle')}</div></div></div></main></div>${foot('02 / AGENT-FIRST OVERVIEW')}</div>`}
