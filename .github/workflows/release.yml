name: Release

# Builds every binary this repo produces and publishes them as a GitHub release, so
# nobody needs Deno to *use* these tools.
#
# One tag moves both binaries (see .plans/archived/release-and-installer.md decision 8):
# `vX.Y.Z` gates devc and devc-bridge together, and the tag is the source of truth —
# nothing here rewrites a VERSION during the build, a tag that disagrees with one just
# fails before anything is compiled.
#
# NOT the whole repo: the Features under features/ carry their own versions and are
# published by publish-feature.yml on a push to main. Nothing in this workflow touches
# ghcr.io. See .plans/archived/feature-independent-versions.md.
#
# `workflow_dispatch` with `dry_run` (the default) runs the whole matrix and uploads the
# assets as workflow artifacts *without* creating a release, so the pipeline can be
# exercised before a tag exists — and, since a dispatch can target a tag, re-exercised
# against the exact ref about to be released.
#
# The one place the two workflows still meet: devc-bridge's Feature downloads its client
# from a release *this* workflow produces, pinned as DEVC_TOOLS_RELEASE in its install.sh.
# So a release unblocks that Feature's publish — but only on the next push to main under
# features/. Tagging publishes no Features.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload workflow artifacts only — do not publish'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Pinned to the version this repo builds with, everywhere.
  DENO_VERSION: '2.9.5'

jobs:
  # Both gates on the cheapest runner, before any build starts.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # A released binary must not disagree with the commit it claims to be, so this
      # fails rather than stamping a version into the source during the build. All three
      # VERSIONs move in lockstep; the tag decides.
      - name: Version guard
        id: guard
        run: |
          set -euo pipefail
          read_version() {
            sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" "$1" | head -1
          }
          devc="$(read_version devc/help.ts)"
          host="$(read_version devc-bridge/host/version.ts)"
          client="$(read_version devc-bridge/client/version.ts)"
          echo "devc/help.ts               $devc"
          echo "devc-bridge/host/version.ts   $host"
          echo "devc-bridge/client/version.ts $client"
          for v in "$devc" "$host" "$client"; do
            if [ -z "$v" ]; then
              echo "::error::could not read a VERSION — has the const's shape changed?"
              exit 1
            fi
          done
          if [ "$devc" != "$host" ] || [ "$devc" != "$client" ]; then
            echo "::error::the three VERSION constants disagree ($devc / $host / $client)"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [ "$tag" != "v$devc" ]; then
              echo "::error::tag $tag disagrees with VERSION $devc"
              echo "::error::the tag is the source of truth; bump the three VERSION consts to match it and re-tag"
              echo "::error::(a prerelease is no exception — to tag v0.1.0-rc.1, VERSION must be 0.1.0-rc.1, so the binary never claims a version its release does not have)"
              exit 1
            fi
          else
            tag="v$devc"
          fi
          echo "version=$devc" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A release must not be publishable from a red tree. Both suites, not just devc's:
      # the bridge host is one of the binaries this workflow ships.
      - name: Format
        run: deno fmt --check

      - name: devc — check + test
        working-directory: devc
        run: |
          deno task check
          deno task test

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # devc-core colocates package.json next to deno.json, which switches Deno's npm-specifier
      # resolution from the global cache to a local node_modules/ it expects to already be
      # populated (`deno check`/`deno test` below load overlay.ts's `import ... from
      # 'jsonc-parser'`) — unlike devc/, which has no package.json and resolves npm: imports
      # from the global cache with no install step at all. Must run before either task.
      - name: devc-core — install npm deps
        working-directory: devc-core
        run: npm ci

      # @devc-tools/core (see .plans/devc-core-npm-library.md) — the library `devc` compiles
      # from source and that also ships to npm. Checked under Deno first, same as devc itself.
      - name: devc-core — check + test
        working-directory: devc-core
        run: |
          deno task check
          deno task test

      # The failure this catches is silent otherwise: a stray `Deno.` (or `jsr:`) import keeps
      # every `deno test` above green and only breaks the npm build — see the design decision
      # in .plans/devc-core-npm-library.md ("Node compatibility needs a CI guard").
      - name: 'devc-core — portability check (no Deno./jsr: outside tests/)'
        working-directory: devc-core
        run: npm run portability-check

      # The other half of the portability claim: build the npm package, pack it, install the
      # tarball into a scratch project, and drive it with plain `node` — no Deno, no
      # `devcontainer`, no `devc` anywhere on PATH. See smoke.sh/smoke.mjs and the plan's
      # Validation section ("npm pack the library ... Node only"). Deps are already installed
      # above; nothing here needs a fresh `npm ci`.
      - name: devc-core — npm build + pack + node smoke test
        working-directory: devc-core
        run: npm run smoke

      - name: devc-bridge host — check + test
        working-directory: devc-bridge/host
        run: |
          deno task check
          deno task test

      # The git-push/git-doctor recipes: a local bare repo stands in for the remote, no network.
      - name: devc-bridge git recipes — offline harness
        run: bash devc-bridge/tests/git_push_test.sh

      - name: devc-bridge client — check
        working-directory: devc-bridge/client
        run: deno task check

      # The installer is shipped by this workflow, so its harness gates it too.
      - name: install.sh — shell harness
        run: bash tests/install_test.sh install.sh

      # Cheap, and guards the one mistake in here that cannot be walked back.
      - name: workflow publish guards
        run: bash tests/workflow_guards_test.sh

  # One job per target. The two Linux legs build and *run* what they just built (decision
  # 4 in release-and-installer.md — a native runner can execute what it compiled, so "does
  # this run on Apple Silicon" is a CI assertion instead of a stranger's bug report). The
  # two macOS targets no longer get that: this repo spent real time stuck on
  # macOS-hosted-runner unavailability twice in one week (macos-13 fully retired by
  # GitHub in December 2025 — a job requesting it just queues forever rather than
  # failing outright — and macos-14, its replacement, already mid-deprecation as of
  # August 2026), for two binaries that are the whole reason `devc`/`devc-bridge host`
  # need macOS at all. `deno compile --target` cross-compiles the two darwin targets
  # from a Linux runner just fine — proven back in release-and-installer.md's own Risks
  # section — so they build here too, just without native execution or code signing to
  # back them: no `codesign` on Linux, and Deno's own ad-hoc signing behavior differs by
  # architecture on a REAL Mac (the ad-hoc sign step this replaced existed only to paper
  # over that). Both mac binaries therefore ship unsigned; see README.md.
  #
  # If ubuntu-24.04-arm is ever unavailable to this repo, the contained fallback is to
  # drop that row and cross-build aarch64-unknown-linux-gnu from ubuntu-24.04 too — losing
  # native execution for that one asset, the same trade this comment already accepts for
  # both darwin ones.
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      DEVC_TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # The compile flags live in the repo's own tasks, never inlined here: permission
      # flags drifting between a local build and a released binary is the failure that
      # avoids. `--target` and the dist/ output path come through $DEVC_TARGET, cross-
      # compiling the two darwin targets same as the two Linux ones.
      - name: Build devc
        working-directory: devc
        run: deno task build:release

      # macOS-target only (by $DEVC_TARGET, not runner.os — every leg here runs on Linux
      # now). Every command the bridge host ships is macOS (`caffeinate`), so a Linux
      # asset would have nothing to run.
      - name: Build devc-bridge host
        if: contains(matrix.target, 'apple-darwin')
        working-directory: devc-bridge/host
        run: deno task build:release

      # Linux-target only, and it is the *container* client: an arm64 Mac gets the
      # aarch64 Linux one, built here on the arm64 Linux runner.
      - name: Build devc-bridge client
        if: contains(matrix.target, 'linux-gnu')
        working-directory: devc-bridge/client
        run: deno task build:release

      # Native runner, native binary: this is the real proof decision 4 wants, for both
      # Linux legs — running the compiled binary and checking its --version output.
      #
      # The two darwin legs cannot do that from here (wrong OS to execute a Mach-O
      # binary), so they get the weaker check the "no macOS runners" trade costs: `file`
      # confirms the output is actually a Mach-O binary for the right architecture, not
      # that it runs. That gap is exactly why they ship unsigned and undocumented as
      # "verified" — see the comment on the `build` job above and README.md.
      - name: Smoke test
        run: |
          set -euo pipefail
          fail=0
          smoke() { # smoke <binary> <expected output>
            if [ ! -f "$1" ]; then
              echo "::error::$1 was not built"; fail=1; return
            fi
            got="$("$1" --version 2>/dev/null)"
            if [ "$got" = "$2" ]; then
              echo "  ok   $1 -> $got"
            else
              echo "::error::$1 printed '$got', expected '$2'"; fail=1
            fi
          }
          smoke_file() { # smoke_file <binary> <expected `file -b` substring>
            if [ ! -f "$1" ]; then
              echo "::error::$1 was not built"; fail=1; return
            fi
            got="$(file -b "$1")"
            case "$got" in
              *"$2"*) echo "  ok   $1 -> $got" ;;
              *) echo "::error::$1 is '$got', expected to contain '$2'"; fail=1 ;;
            esac
          }
          case "$DEVC_TARGET" in
            *-apple-darwin)
              case "$DEVC_TARGET" in
                x86_64-*) macho='x86_64' ;;
                aarch64-*) macho='arm64' ;;
              esac
              smoke_file dist/devc/devc "Mach-O 64-bit $macho executable"
              smoke_file dist/devc-bridge-host/devc-bridge "Mach-O 64-bit $macho executable"
              ;;
            *)
              smoke dist/devc/devc "devc $VERSION"
              smoke dist/devc-bridge-client/devc-bridge "devc-bridge $VERSION"
              ;;
          esac
          exit "$fail"

      # <tool>-<version>-<triple>.tar.gz, the shape GoReleaser and most Rust/Go releases
      # use. The version is in the middle for two reasons: digits sort before letters, so
      # devc-bridge-* can never wedge itself into the middle of devc-* on the release page;
      # and a downloaded archive says which version it is instead of colliding in
      # ~/Downloads. $VERSION is bare here — the `v` belongs to the tag, not the file.
      #
      # Every asset is a .tar.gz, even a single binary: executable bits matter and tar
      # carries mode, zip does not portably. One archive format keeps the installer's
      # extract path single.
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          tar -czf "dist/assets/devc-$VERSION-$DEVC_TARGET.tar.gz" -C dist/devc devc
          if [ -d dist/devc-bridge-host ]; then
            tar -czf "dist/assets/devc-bridge-host-$VERSION-$DEVC_TARGET.tar.gz" \
              -C dist/devc-bridge-host devc-bridge
          fi
          if [ -d dist/devc-bridge-client ]; then
            tar -czf "dist/assets/devc-bridge-client-$VERSION-$DEVC_TARGET.tar.gz" \
              -C dist/devc-bridge-client devc-bridge
          fi
          ls -l dist/assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.target }}
          path: dist/assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/incoming
          pattern: assets-*
          merge-multiple: true

      # The release matrix, spelled out. Asserting set equality here rather than counting
      # files is what catches a build job that silently produced the wrong asset — and
      # tests/install_test.sh greps this list, so the installer and the workflow cannot
      # drift apart on an asset name without one of them failing.
      - name: Collect + checksums
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/incoming/*.tar.gz dist/release/
          cat > /tmp/expected.txt <<EOF
          devc-$VERSION-aarch64-apple-darwin.tar.gz
          devc-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          devc-$VERSION-x86_64-apple-darwin.tar.gz
          devc-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          devc-bridge-client-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          devc-bridge-client-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          devc-bridge-host-$VERSION-aarch64-apple-darwin.tar.gz
          devc-bridge-host-$VERSION-x86_64-apple-darwin.tar.gz
          EOF
          (cd dist/release && ls -1 ./*.tar.gz | sed 's#^\./##' | sort) > /tmp/actual.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::the collected assets are not the eight this release publishes"
            exit 1
          fi
          (cd dist/release && sha256sum ./*.tar.gz | sed 's#\./##' > checksums.txt)
          # Verify the file we are about to ship actually verifies, with the same tool the
          # installer uses.
          (cd dist/release && sha256sum -c checksums.txt)
          cat dist/release/checksums.txt

      # install.sh ships as a release asset rather than from `main`, so the copy served at
      # releases/latest/download/install.sh is the one that release was built and tested
      # with. Stamping the tag into it means it installs its own release's binaries: no
      # GitHub API call, no rate limit, no drift from the assets beside it.
      - name: Stamp install.sh
        run: |
          set -euo pipefail
          sed "s/^DEVC_RELEASE_VERSION=.*/DEVC_RELEASE_VERSION='$TAG'/" install.sh \
            > dist/release/install.sh
          grep -q "^DEVC_RELEASE_VERSION='$TAG'\$" dist/release/install.sh || {
            echo "::error::the devc:stamp fence in install.sh did not take"
            exit 1
          }
          chmod 0755 dist/release/install.sh
          sh -n dist/release/install.sh

      # The dry run stops here: everything above ran, nothing is published.
      #
      # `inputs` is null outside workflow_dispatch, so `!inputs.dry_run` is true on a tag
      # push and normal releases are unaffected. Checking it — rather than the ref alone —
      # matters because a dispatch can target a *tag*, and gating on the ref alone would
      # publish a release from a run whose own checkbox said dry run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dry_run }}
        with:
          name: release-${{ needs.gate.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      # `gh` over a third-party action, deliberately: fewer third parties in the path that
      # produces binaries people `curl | sh`. A tag with a pre-release suffix (v0.1.0-rc.1)
      # publishes as a prerelease, so `releases/latest` keeps pointing at the last stable.
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=''
          case "$TAG" in *-*) prerelease='--prerelease' ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            dist/release/*
