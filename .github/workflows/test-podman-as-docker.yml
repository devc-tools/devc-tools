name: Test podman-as-docker (native Linux Docker)

# Closes a gap review surfaced in the podman-as-docker Feature: it was built and measured
# entirely against Docker Desktop's LinuxKit VM, which — unlike a normal Linux Docker Engine
# host — already runs with no seccomp filter and no AppArmor profile applied (see
# docs/manual-verification.md §13 and the Feature's README). So "capAdd:[SYS_ADMIN] +
# securityOpt:[systempaths=unconfined], nothing else" was never actually exercised against
# the two restrictions a stock Linux host adds on top: the `docker-default` seccomp profile
# and the `docker-default` AppArmor profile. A GitHub-hosted `ubuntu-latest` runner is a real
# Linux Docker Engine host with both enforced — the exact case the Feature's own coworker
# audience (Linux users, not Docker Desktop) actually runs — so this is the cheap way to
# answer the question without anyone buying a Linux box.
#
# Does NOT close the third flag some upstream examples carry, `--security-opt
# label=disable` — that is SELinux-specific, and neither Docker Desktop nor a GitHub Ubuntu
# runner uses SELinux (Ubuntu's mandatory-access-control layer is AppArmor). Confirming that
# one needs a Fedora/RHEL/CentOS host and stays an open question — see the Feature's README.
#
# Manual trigger only: this needs Docker, a network (apt + image pulls inside the built
# container), and roughly a minute of image builds — not something to run on every push, and
# not part of tests/features_test.sh's offline walk.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Base image for the default (autogenerated) scenario — must carry a podman package'
        type: string
        default: mcr.microsoft.com/devcontainers/base:ubuntu-24.04

permissions:
  contents: read

env:
  # Same pin publish-feature.yml uses, for the same reason: a fixed, known-good version
  # rather than a floating one silently changing this workflow's behavior.
  DEVCONTAINERS_CLI_VERSION: '0.88.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Makes the thing this workflow exists to prove true — visible in the log, not assumed.
      # A GitHub-hosted runner's own Docker host applies the `docker-default` seccomp and
      # AppArmor profiles to a plain container by default; if this ever shows Seccomp: 0 or
      # an empty AppArmor profile (a runner-image change upstream), this workflow is silently
      # no longer testing what its name says it is.
      - name: Confirm this runner enforces what Docker Desktop does not
        run: |
          set -euo pipefail
          seccomp="$(docker run --rm mcr.microsoft.com/devcontainers/base:ubuntu-24.04 \
            grep Seccomp: /proc/self/status)"
          apparmor="$(docker run --rm mcr.microsoft.com/devcontainers/base:ubuntu-24.04 \
            sh -c 'cat /proc/self/attr/current 2>/dev/null || true')"
          echo "$seccomp"
          echo "AppArmor: ${apparmor:-(empty)}"
          echo "$seccomp" | grep -qE '^Seccomp:\s*[12]' ||
            { echo "::error::this runner's default container has no seccomp filter (Seccomp: 0) — not the case this workflow exists to test"; exit 1; }
          [ -n "$apparmor" ] ||
            { echo "::error::this runner's default container has no AppArmor profile applied — not the case this workflow exists to test"; exit 1; }

      # Same pin release.yml already uses for this action.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install the devcontainers CLI
        run: npm install --global "@devcontainers/cli@$DEVCONTAINERS_CLI_VERSION"

      # The default (autogenerated) scenario: `docker run --rm alpine true` with *zero*
      # runArgs. The test command's own default base image (ubuntu:focal) has no podman
      # package at all — see the Feature's README — hence the explicit override.
      - name: Default scenario (bare {}, no runArgs)
        run: |
          bash features/podman-as-docker/test/run-features-test.sh \
            --base-image "${{ inputs.base_image }}" --skip-scenarios

      # with_tun, with_socket, with_volume, no_shim — each declares its own base image in
      # test/scenarios.json, so no --base-image here.
      - name: Scenarios (with_tun, with_socket, with_volume, no_shim)
        run: |
          bash features/podman-as-docker/test/run-features-test.sh --skip-autogenerated
