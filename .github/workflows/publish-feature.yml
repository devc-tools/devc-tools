name: Publish devcontainer Features

# Publishes every allowlisted Feature in features/ to ghcr.io/devc-tools/features/<id>. The
# collection is walked, never enumerated: adding a directory under features/ is the whole of
# adding a Feature to this workflow — see features/README.md. Whether it *publishes* is a
# separate question, answered by features/PUBLISH_ALLOWLIST.txt (below).
#
# Each Feature carries its **own** version and publishes on a push to `main` that touches
# features/, not on the repo's `v*` tag (see
# .plans/archived/feature-independent-versions.md). The binaries keep their one-version rule
# in release.yml; only Features are unpinned from it. A one-line fix to a Feature's
# install.sh therefore ships without a four-runner binary release, which is the point.
#
# Publish-on-push is safe because the CLI skips a version it already finds in the registry —
# so a run that changes nothing publishes nothing, and "you forgot to bump the version"
# surfaces immediately as "nothing published" rather than silently at the next release. That
# skip is load-bearing, which is why the CLI is pinned below rather than tracking @latest.
#
# `workflow_dispatch` with `dry_run` (the default) runs everything except the publish, so the
# packaging and both guards can be exercised before a push lands. `inputs` is null outside
# workflow_dispatch, so `!inputs.dry_run` is true on a push to main and normal merges are
# unaffected.
#
# Reaching the tree is not enough to publish: `discover` narrows the matrix to the ids listed
# in features/PUBLISH_ALLOWLIST.txt, so a Feature under active development sits in features/
# fully guarded and still does not ship until it is added there. See
# features/CONTRIBUTING.md#the-publish-allowlist.

on:
  push:
    branches: [main]
    paths:
      - 'features/**'
      - '.github/workflows/publish-feature.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and validate only — do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  # Pinned, like DENO_VERSION in release.yml and every action SHA in this repo. `@latest` in
  # a pipeline that pushes artifacts people pull into their containers is one silent upgrade
  # away from a different publish semantics — and this workflow depends on a specific
  # behavior of it: "Version X already exists, skipping", plus floating tags that only
  # advance for the max satisfying version. That measurement was made against 0.88.0.
  DEVCONTAINERS_CLI: '@devcontainers/cli@0.88.0'

jobs:
  # Collection-wide checks and the matrix, on the cheapest runner, before any publish job
  # starts.
  discover:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Offline, whole collection, and deliberately ungated: a dry run must still check.
      - name: Collection guard
        run: bash tests/features_test.sh

      # Collection membership is derived from the tree, never spelled out — a static list
      # here would reintroduce the exact failure features-collection removed, where the next
      # Feature added is silently not covered. Empty is a failure: it means the collection
      # moved and the matrix below would publish nothing while reporting success.
      #
      # What *does* publish is narrower than what is found: only the ids listed in
      # features/PUBLISH_ALLOWLIST.txt reach the matrix. That is the one static list in this
      # collection, and unlike the failure above it fails safe — leaving a Feature off it
      # means it does not publish, not that it publishes unguarded. The Collection guard step
      # above already checked every entry names a real Feature, so this trusts the file
      # rather than re-validating it.
      - name: Discover Features
        id: list
        run: |
          set -euo pipefail
          all=()
          for manifest in features/*/devcontainer-feature.json; do
            # No nullglob here, so an unmatched glob arrives as its own literal.
            [ -f "$manifest" ] || continue
            all+=("$(basename "$(dirname "$manifest")")")
          done
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no features/*/devcontainer-feature.json found — has the collection moved?"
            exit 1
          fi
          echo "found ${#all[@]} Feature(s) in the collection: ${all[*]}"

          ids=()
          # `|| true`: grep exits 1 on an allowlist with no matching lines (every Feature
          # temporarily held back), which is a valid state here, not a failure — and a
          # process substitution's own exit code is invisible to this script's `set -e`
          # regardless, so this is belt-and-suspenders for a reader, not for the shell.
          while IFS= read -r id; do
            ids+=("$id")
          done < <(grep -vE '^[[:space:]]*(#|$)' features/PUBLISH_ALLOWLIST.txt || true)

          features="$(printf '%s\n' "${ids[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "publishing ${#ids[@]} of ${#all[@]} Feature(s) (see features/PUBLISH_ALLOWLIST.txt): $features"
          echo "features=$features" >> "$GITHUB_OUTPUT"

  # One job per Feature, so no Feature can block another. `features publish ./features` takes
  # the collection as a unit: one failing guard fails the run, and node-nvmrc — which
  # downloads nothing and pins no release — could not publish until a devc-tools release was
  # tagged for devc-bridge's sake. That is the exact coupling this workflow's rewrite exists
  # to remove, so `fail-fast: false` here is load-bearing rather than hygiene.
  #
  # `features publish <one Feature dir>` lands on the identical ghcr.io/<ns>/<id> ref the
  # collection publish would produce; nothing about the published artifact changes. Its one
  # cost is that every run also pushes a devcontainer-collection.json describing only what
  # *that* run packaged — so each job here overwrites the shared collection index with a
  # one-Feature view of it. That is what the collection-index job below exists to repair.
  #
  # `--namespace` must have at least two segments. The CLI derives the collection-index ref
  # from the namespace alone — `ghcr.io/<namespace>`, with no `/<id>` — and GHCR rejects a
  # single-segment repository name with `NAME_INVALID`. That push is unconditional and has no
  # suppression flag, so at `--namespace <owner>` every publish exits 1 *after* successfully
  # pushing the Feature. Hence `<owner>/features`: it keeps Features one segment shorter than
  # `${{ github.repository }}` would (ghcr.io/devc-tools/features/<id>, not
  # ghcr.io/devc-tools/devc-tools/<id>) while still giving the index somewhere valid to land.
  publish:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.discover.outputs.features) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The guard the tag trigger used to provide by accident: a Feature that downloads from
      # a devc-tools release must not ship pinned to a release nobody has tagged. Scoped to
      # this job's own Feature, which is what keeps devc-bridge's unmet pin out of
      # node-nvmrc's job. Ungated — a dry run must still check.
      - name: Release pin guard (Feature)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/features_test.sh --check-release-pins --feature "${{ matrix.feature }}"

      - name: Package
        run: |
          npx --yes "$DEVCONTAINERS_CLI" features package "./features/${{ matrix.feature }}" \
            --force-clean-output-folder --output-folder ./dist/features

      # Plain `docker login` rather than a third-party action: one less thing in the path that
      # produces an artifact people pull into their containers.
      #
      # The step names in this file are deliberately non-overlapping — no name is a substring
      # of another. tests/workflow_guards_test.sh finds a step's `if:` by the first line
      # containing `- name: <name>`, so two steps whose names share a prefix would let the
      # harness check one of them twice and the other never.
      - name: Log in to ghcr.io (Feature)
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # → ghcr.io/devc-tools/features/<id>, tagged latest / <major> / <major>.<minor> /
      # <version> from this Feature's own version. A version already in the registry is
      # skipped, so re-running this on a push that changed nothing pushes nothing.
      - name: Publish Feature
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes "$DEVCONTAINERS_CLI" features publish "./features/${{ matrix.feature }}" \
            --namespace "${{ github.repository_owner }}/features"

  # Repairs the shared collection index at ghcr.io/devc-tools/features — a metadata-only
  # artifact (one `devcontainer-collection.json` layer) that lists what is in the collection.
  # `features publish` pushes it on every run and there is no flag to suppress it, so each
  # per-Feature job above leaves it describing only that Feature. Left alone it does not just
  # go stale, it *alternates*: whichever Feature published last is the whole collection
  # according to it. It is decorative — `devc` never reads it and `devcontainer features
  # info` resolves a Feature through its own OCI annotations — but it is visible on the
  # repo's Packages page, so wrong-and-alternating is worth one more job.
  #
  # "the whole collection" here means the whole *allowlisted* subset, not every directory
  # under features/: a Feature features/PUBLISH_ALLOWLIST.txt holds back must not show up in the
  # index either, or this repair job would be the one place that quietly bypasses the gate
  # `discover` enforces everywhere else.
  #
  # `needs: publish` is the safety, not a convenience: a job whose needs did not all succeed
  # is skipped, so this runs only when EVERY allowlisted Feature published cleanly. That
  # matters because the repair is a whole-collection publish, which would otherwise push a
  # Feature whose release pin the matrix just rejected. When it is skipped the index simply
  # keeps its previous value — stale, which is what it already was. `needs: discover` is
  # added alongside it only to read discover's own output; it adds no new skip condition
  # `needs: publish` did not already give, since publish itself needs discover.
  #
  # By the time this runs every allowlisted Feature is already published at its current
  # version, so the CLI skips all of them and only the collection document is rewritten —
  # this time listing the whole allowlisted collection.
  collection-index:
    needs: [discover, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Redundant *only* because `needs: publish` holds: every pin was already checked
      # per-Feature above, and this job is skipped unless those passed. That is exactly why
      # it stays — the redundancy rests on one `needs:` line, and an `if: always()` added
      # here later would silently turn this into an unguarded whole-collection publish,
      # which is the one operation in this file that can push a Feature whose release does
      # not exist. Cheap, and it fails closed if the reasoning above ever stops being true.
      #
      # One `--feature` call per allowlisted id, not a bare whole-tree check: a Feature held
      # back by PUBLISH_ALLOWLIST (in development, possibly with no release pin decided yet)
      # must not be able to fail this job — it isn't publishing, so its pin is not this job's
      # business. This is the same invocation the matrix above already ran per Feature.
      - name: Release pin guard (collection)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in $(echo '${{ needs.discover.outputs.features }}' | jq -r '.[]'); do
            bash tests/features_test.sh --check-release-pins --feature "$id"
          done

      # `features publish` packages whatever directory it is pointed at wholesale — it has no
      # flag to publish a subset of a collection — so the allowlisted Features are copied out
      # to a directory of their own rather than pointing the command at ./features directly.
      # Pointing it at ./features here would publish every Feature's index entry regardless
      # of PUBLISH_ALLOWLIST, silently undoing the gate this whole workflow exists to add.
      - name: Stage the allowlisted collection
        run: |
          set -euo pipefail
          rm -rf /tmp/publishable-features
          mkdir -p /tmp/publishable-features
          for id in $(echo '${{ needs.discover.outputs.features }}' | jq -r '.[]'); do
            cp -R "features/$id" "/tmp/publishable-features/$id"
          done
          ls /tmp/publishable-features

      - name: Log in to ghcr.io (collection)
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish collection index
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes "$DEVCONTAINERS_CLI" features publish /tmp/publishable-features \
            --namespace "${{ github.repository_owner }}/features"
