<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>devcd</title>
    <link rel="stylesheet" href="./vendor/xterm/xterm.css">
    <link rel="stylesheet"
      href="./vendor/golden-layout/css/goldenlayout-base.css">
    <link
      rel="stylesheet"
      href="./vendor/golden-layout/css/themes/goldenlayout-dark-theme.css"
    >
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <span class="brand">devc web</span>
          <span class="conn" id="conn" data-state="connecting">connecting</span>
          <div
            class="scope-picker"
            id="scope"
            role="radiogroup"
            aria-label="Sidebar shows"
          >
            <button
              type="button"
              role="radio"
              data-scope="all"
              aria-checked="true"
              tabindex="0"
              aria-label="Show all"
              title="Show all"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 4h11M2.5 8h11M2.5 12h11" />
              </svg>
            </button>
            <button
              type="button"
              role="radio"
              data-scope="container"
              aria-checked="false"
              tabindex="-1"
              aria-label="Show the focused tile's container"
              title="Show the focused tile's container"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 2.5l5 2.75v5.5L8 13.5l-5-2.75v-5.5zM3 5.25L8 8l5-2.75M8 8v5.5" />
              </svg>
            </button>
            <button
              type="button"
              role="radio"
              data-scope="repo"
              aria-checked="false"
              tabindex="-1"
              aria-label="Show the focused tile's repo"
              title="Show the focused tile's repo"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 3.5h11v9h-11zM2.5 6.5h11" />
              </svg>
            </button>
          </div>
          <button
            class="sidebar-toggle"
            id="copy-url"
            type="button"
            aria-label="Copy page URL"
            title="Copy page URL"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5.5 5.5h8v8h-8zM10.5 5.5v-3h-8v8h3" />
            </svg>
          </button>
        </header>
        <nav class="tree" id="tree" aria-label="Containers"></nav>
      </aside>
      <div
        class="sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        title="Drag to resize, double-click to reset"
      ></div>
      <main class="tiles" id="tiles"></main>
      <button
        class="sidebar-toggle sidebar-corner"
        id="sidebar-toggle"
        type="button"
        aria-label="Hide sidebar"
        title="Hide sidebar"
      >
        <svg class="icon-hide" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M12 4l-4 4 4 4M7.5 4l-4 4 4 4" />
        </svg>
        <svg class="icon-show" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4l4 4-4 4M8.5 4l4 4-4 4" />
        </svg>
      </button>
    </div>
    <div class="menu" id="menu" role="menu" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="./boot.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
