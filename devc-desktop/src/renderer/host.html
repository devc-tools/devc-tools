<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
    <title>host terminal</title>
    <link rel="stylesheet" href="xterm.css">
    <link rel="stylesheet" href="goldenlayout-base.css">
    <link rel="stylesheet" href="goldenlayout-dark-theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="actions.css">
    <link rel="stylesheet" href="host.css">
  </head>
  <body data-closed>
    <header id="strip" title="Drag to resize">
      <span
        id="left"><span id="who"></span><span id="badge" hidden></span></span>
      <span id="hint"></span>
    </header>
    <div id="paste" hidden>
      <span>Paste <b id="paste-lines"></b> into the host shell?</span>
      <pre id="paste-text"></pre>
      <button id="paste-ok" type="button">Paste</button>
      <button id="paste-cancel" type="button">Cancel</button>
    </div>
    <main id="body">
      <aside id="actions" aria-label="Actions" hidden></aside>
      <div id="tiles" class="tiles">
        <div id="root" class="layout-root"></div>
        <div id="empty" hidden>
          <p id="refused" hidden></p>
          <button id="empty-new" type="button">New terminal</button>
        </div>
      </div>
    </main>
    <!-- Deferred: Golden Layout, made while the document is still loading, puts off its own
         init to DOMContentLoaded, and the tiles' first load would throw. -->
    <script defer src="host.js"></script>
  </body>
</html>
