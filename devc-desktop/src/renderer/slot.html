<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
    <title>host tile</title>
    <link rel="stylesheet" href="xterm.css">
    <link rel="stylesheet" href="slot.css">
  </head>
  <body>
    <header id="strip"><b>HOST</b> · <span id="who"></span></header>
    <div id="paste" hidden>
      <span>Paste <b id="paste-lines"></b> into the host shell?</span>
      <pre id="paste-text"></pre>
      <button id="paste-ok" type="button">Paste</button>
      <button id="paste-cancel" type="button">Cancel</button>
    </div>
    <main id="term"></main>
    <div id="guard" hidden>
      Input paused: this terminal just moved. Click it to type.
    </div>
    <script defer src="slot.js"></script>
  </body>
</html>
